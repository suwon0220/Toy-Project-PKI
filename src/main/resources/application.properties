spring.application.name=pki

# 플래시 메시지 리다이렉트 시 URL에 ;jsessionid 가 붙지 않도록
server.servlet.session.tracking-modes=cookie
# Shared labels and error messages
spring.messages.basename=messages,errors
spring.messages.fallback-to-system-locale=false
# KMS 설정
kms.base-url=${KMS_BASE_URL:http://localhost:8081}
kms.connect-timeout=${KMS_CONNECT_TIMEOUT:3s}
kms.read-timeout=${KMS_READ_TIMEOUT:30s}
# 인증서 관련
# display time zone
pki.time-zone=${PKI_TIME_ZONE:Asia/Seoul}

# 로컬 개발용 H2
spring.datasource.url=jdbc:h2:./data/pkiDB
spring.datasource.username=sa
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# 로컬 개발 시 템플릿 변경과 상세 로그 확인
spring.thymeleaf.cache=false
logging.level.toy.pki=DEBUG
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=INFO
spring.mvc.log-request-details=true
logging.level.toy.kms.application.web.HttpJsonLoggingFilter=DEBUG
