<!DOCTYPE html>
<!--/*
  PKI 콘솔 공통 레이아웃.
  사용: <html th:replace="~{pki/fragments/layout :: shell('인증서 발급', ~{::main}, 'issue')}">
  activeMenu: issue | certificates | profiles | ocsp | kms
  공통 Model(선택): flashSuccess, flashError (String), currentUser (String)
*/-->
<html lang="ko" th:fragment="shell(title, content, activeMenu)" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title th:text="|${title} · PKI Console|">PKI Console</title>
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/pki.css}">
</head>
<body>
<div class="shell">
    <aside class="sidebar">
        <a class="brand" th:href="@{/pki/certificates}">
            <span class="brand-name">PKI Console</span>
            <span class="brand-sub">인증서 인프라</span>
        </a>
        <nav aria-label="PKI 메뉴" class="nav">
            <a th:attr="aria-current=${activeMenu == 'issue'} ? 'page'" th:href="@{/pki/certificates/new}">인증서 발급</a>
            <a th:attr="aria-current=${activeMenu == 'certificates'} ? 'page'" th:href="@{/pki/certificates}">인증서 상태
                관리</a>
            <a th:attr="aria-current=${activeMenu == 'profiles'} ? 'page'" th:href="@{/pki/profiles}">인증서 프로파일</a>
            <a th:attr="aria-current=${activeMenu == 'ocsp'} ? 'page'" th:href="@{/pki/ocsp/logs}">OCSP 로그</a>
            <a th:attr="aria-current=${activeMenu == 'kms'} ? 'page'" th:href="@{/pki/kms}">KMS 키</a>
        </nav>
        <div class="side-foot" th:text="${currentUser} ?: 'anonymous'">anonymous</div>
    </aside>

    <div class="main">
        <div class="alert alert-ok" role="status" th:if="${flashSuccess}">
            <svg aria-hidden="true" fill="none" height="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                 stroke-width="2" viewBox="0 0 24 24" width="18">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            <div th:text="${flashSuccess}">처리했습니다.</div>
        </div>
        <div class="alert alert-err" role="alert" th:if="${flashError}">
            <svg aria-hidden="true" fill="none" height="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                 stroke-width="2" viewBox="0 0 24 24" width="18">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" x2="12" y1="8" y2="12"></line>
                <line x1="12" x2="12.01" y1="16" y2="16"></line>
            </svg>
            <div th:text="${flashError}">처리하지 못했습니다.</div>
        </div>

        <main th:replace="${content}"></main>
    </div>
</div>
</body>
</html>
