<!DOCTYPE html>
<!--/*
  PKI 콘솔 공통 레이아웃.
  사용: <html th:replace="~{pki/fragments/layout :: shell('인증서 발급', ~{::main}, 'issue')}">
  activeMenu: issue | certificates | profiles | ocsp | kms
  공통 Model(선택): flashSuccess, flashError (String), currentUser (String)
*/-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:fragment="shell(title, content, activeMenu)">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="|${title} · PKI Console|">PKI Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" th:href="@{/css/pki.css}">
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <a class="brand" th:href="@{/pki/certificates}">
      <span class="brand-name">PKI Console</span>
      <span class="brand-sub">인증서 인프라</span>
    </a>
    <nav class="nav" aria-label="PKI 메뉴">
      <a th:href="@{/pki/certificates/new}" th:attr="aria-current=${activeMenu == 'issue'} ? 'page'">인증서 발급</a>
      <a th:href="@{/pki/certificates}" th:attr="aria-current=${activeMenu == 'certificates'} ? 'page'">인증서 상태 관리</a>
      <a th:href="@{/pki/profiles}" th:attr="aria-current=${activeMenu == 'profiles'} ? 'page'">인증서 프로파일</a>
      <a th:href="@{/pki/ocsp/logs}" th:attr="aria-current=${activeMenu == 'ocsp'} ? 'page'">OCSP 로그</a>
      <a th:href="@{/pki/kms}" th:attr="aria-current=${activeMenu == 'kms'} ? 'page'">KMS 키</a>
    </nav>
    <div class="side-foot" th:text="${currentUser} ?: 'anonymous'">anonymous</div>
  </aside>

  <div class="main">
    <div th:if="${flashSuccess}" class="alert alert-ok" role="status">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"></polyline></svg>
      <div th:text="${flashSuccess}">처리했습니다.</div>
    </div>
    <div th:if="${flashError}" class="alert alert-err" role="alert">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
      <div th:text="${flashError}">처리하지 못했습니다.</div>
    </div>

    <main th:replace="${content}"></main>
  </div>
</div>
</body>
</html>
