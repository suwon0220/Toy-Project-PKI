<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<head><title>인증서 목록 · Toy PKI</title></head>
<body>
<main class="content">
  <div class="page-head">
    <div>
      <h1>인증서</h1>
      <p>발급된 모든 X.509 인증서를 검색하고 상태를 확인합니다.</p>
    </div>
    <div class="page-actions">
      <a class="btn btn-primary" th:href="@{/certificates/issue}"><svg th:replace="~{fragments/components :: icon('plus')}"></svg>인증서 발급</a>
    </div>
  </div>

  <section class="card">
    <form class="filters" th:action="@{/certificates}" method="get">
      <div class="field field-grow">
        <label class="field-label" for="q">검색</label>
        <input id="q" class="input" type="search" name="q" th:value="${q}" placeholder="Subject CN 또는 일련번호">
      </div>
      <div class="field">
        <label class="field-label" for="status">상태</label>
        <select id="status" class="select" name="status">
          <option value="">전체</option>
          <option th:each="s : ${statuses}" th:value="${s.key}" th:text="${s.label}" th:selected="${s.key == status}">유효</option>
        </select>
      </div>
      <div class="field" style="flex:0 0 auto; justify-content:flex-end">
        <button class="btn btn-secondary" type="submit"><svg th:replace="~{fragments/components :: icon('search')}"></svg>적용</button>
      </div>
    </form>

    <div class="table-wrap">
      <table class="table">
        <thead>
        <tr><th>상태</th><th>Subject CN</th><th>일련번호</th><th>프로파일</th><th>발급 CA</th><th>만료일</th><th><span class="sr-only">작업</span></th></tr>
        </thead>
        <tbody>
        <tr th:each="c : ${certificates}">
          <td><span th:replace="~{fragments/components :: status(${c.status})}"></span></td>
          <td><a class="cell-main" th:href="@{/certificates/{s}(s=${c.serial})}" th:text="${c.subjectCn}">api.toy-pki.local</a></td>
          <td class="mono muted" th:text="${c.serial}">4F:A1:...</td>
          <td><span class="tag" th:text="${c.profile}">TLS Server v3</span></td>
          <td class="muted" th:text="${c.issuer}">Toy Issuing CA 1</td>
          <td class="muted" th:text="${#temporals.format(c.notAfter, 'yyyy-MM-dd')}">2027-05-31</td>
          <td><a class="btn btn-ghost btn-sm btn-icon" th:href="@{/certificates/{s}(s=${c.serial})}" aria-label="상세 보기"><svg th:replace="~{fragments/components :: icon('chevron')}"></svg></a></td>
        </tr>
        <tr th:if="${#lists.isEmpty(certificates)}">
          <td colspan="7" class="muted" style="text-align:center; padding:40px">조건에 맞는 인증서가 없습니다.</td>
        </tr>
        </tbody>
      </table>
    </div>
    <div class="pagination">
      <span th:text="|총 ${#lists.size(certificates)}건|">총 8건</span>
      <div class="row">
        <button class="btn btn-secondary btn-sm" disabled>이전</button>
        <button class="btn btn-secondary btn-sm" disabled>다음</button>
      </div>
    </div>
  </section>
</main>
</body>
</html>
