# 오류 화면: 상태별 키가 없으면 5xx 또는 default 문구를 사용한다.
error.400.title=요청을 처리할 수 없어요
error.400.message=요청에 들어간 값이 올바르지 않아요. 주소나 입력값을 확인하고 다시 시도하세요.
error.403.title=접근 권한이 없어요
error.403.message=이 작업을 수행할 권한이 없어요. 필요하면 관리자에게 권한을 요청하세요.
error.404.title=페이지를 찾을 수 없어요
error.404.message=주소가 잘못됐거나, 이미 삭제된 인증서·프로파일·키일 수 있어요.
error.405.title=허용되지 않은 요청 방식이에요
error.405.message=이 주소는 해당 요청 방식을 지원하지 않아요. 화면의 버튼으로 다시 시도하세요.
error.5xx.title=서버에서 오류가 발생했어요
error.5xx.message=요청을 처리하는 중 예상하지 못한 오류가 났어요. 잠시 후 다시 시도하고, 계속되면 아래 요청 ID를 관리자에게 알려 주세요.
error.default.title=요청을 처리할 수 없어요
error.default.message=요청을 처리하지 못했어요. 주소나 입력값을 확인하고 다시 시도하세요.
# MessageFormat에서 작은따옴표는 두 번 써야 화면에 그대로 표시된다.
error.detail.field={0} = ''{1}'' — {2}
error.detail.required={0} — 필수 값이에요
error.expected.invalid=형식이 올바르지 않아요
error.expected.enum={0} 중 하나여야 해요
error.expected.number=숫자여야 해요
error.expected.type={0} 형식이어야 해요
error.stackTrace.truncated=… (상위 {0}줄만)
# KMS 예외 처리의 안전한 응답 메시지 (원격 응답 본문은 사용하지 않는다).
error.kms.400=KMS request is invalid
error.kms.404=KMS key not found
error.kms.502=Invalid KMS response
error.kms.503=KMS is unavailable
certificate.profile.required=활성 프로파일을 선택하세요.
certificate.keyMode.required=키 생성 또는 기존 키 사용을 선택하세요.
certificate.key.notAllowed=프로파일에서 허용한 키 알고리즘을 선택하세요.
certificate.key.required=발급에 사용할 KMS 키를 선택하세요.
certificate.issuer.required=발급 CA 인증서를 선택하세요.
certificate.validity.max=유효기간은 최대 {0}일까지 입력할 수 있습니다.
certificate.dn.required=프로파일에서 요구하는 필수 값입니다.
certificate.issue.failed=인증서를 발급하지 못했습니다. {0}
