# PKI 콘솔 (templates/pki/**) 화면 라벨 · 검증 메시지
# 템플릿은 enum.<타입>.<상수> 키를 찾고, 없으면 enum 이름을 그대로 출력한다.
# ---------- CertStatus ----------
enum.CertStatus.VALID=유효
enum.CertStatus.ON_HOLD=보류
enum.CertStatus.REVOKED=폐지
enum.CertStatus.EXPIRED=만료
# ---------- RevocationReason (RFC 5280 CRLReason) ----------
enum.RevocationReason.UNSPECIFIED=unspecified (0)
enum.RevocationReason.KEY_COMPROMISE=keyCompromise (1)
enum.RevocationReason.CA_COMPROMISE=cACompromise (2)
enum.RevocationReason.AFFILIATION_CHANGED=affiliationChanged (3)
enum.RevocationReason.SUPERSEDED=superseded (4)
enum.RevocationReason.CESSATION_OF_OPERATION=cessationOfOperation (5)
enum.RevocationReason.CERTIFICATE_HOLD=certificateHold (6) — 보류
enum.RevocationReason.REMOVE_FROM_CRL=removeFromCRL (8)
enum.RevocationReason.PRIVILEGE_WITHDRAWN=privilegeWithdrawn (9)
enum.RevocationReason.AA_COMPROMISE=aACompromise (10)
# ---------- KeySource ----------
enum.KeySource.CSR=CSR 업로드
enum.KeySource.KMS=KMS 키
enum.KeySource.SERVER_GENERATED=서버 생성 (PKCS#12)
# ---------- KeyAlgorithm ----------
enum.KeyAlgorithm.EC_P256=EC P-256
enum.KeyAlgorithm.EC_P384=EC P-384
enum.KeyAlgorithm.RSA_2048=RSA 2048
enum.KeyAlgorithm.RSA_3072=RSA 3072
enum.KeyAlgorithm.ED25519=Ed25519
# ---------- OCSP ----------
enum.OcspLogResult.GOOD=GOOD
enum.OcspLogResult.REVOKED=REVOKED
enum.OcspLogResult.UNKNOWN=UNKNOWN
enum.OcspLogResult.ERROR=오류
# ---------- Profile ----------
enum.ProfileCertType.END_ENTITY=최종 개체 (End Entity)
enum.ProfileCertType.SUB_CA=하위 CA (Sub CA)
enum.KeyUsageBit.DIGITAL_SIGNATURE=digitalSignature
enum.KeyUsageBit.CONTENT_COMMITMENT=contentCommitment
enum.KeyUsageBit.KEY_ENCIPHERMENT=keyEncipherment
enum.KeyUsageBit.KEY_AGREEMENT=keyAgreement
enum.KeyUsageBit.KEY_CERT_SIGN=keyCertSign
enum.KeyUsageBit.CRL_SIGN=cRLSign
enum.ExtKeyUsage.SERVER_AUTH=serverAuth
enum.ExtKeyUsage.CLIENT_AUTH=clientAuth
enum.ExtKeyUsage.CODE_SIGNING=codeSigning
enum.ExtKeyUsage.EMAIL_PROTECTION=emailProtection
enum.ExtKeyUsage.TIME_STAMPING=timeStamping
enum.ExtKeyUsage.OCSP_SIGNING=OCSPSigning
# ---------- 검증 오류 코드 (bindingResult.reject / rejectValue) ----------
# issue.rejected 는 두지 않는다: 컨트롤러가 넘기는 기본 메시지(거부 사유)가 그대로 보이도록.
profile.caMismatch=선택한 CA에서 사용할 수 없는 프로파일입니다.
profile.duplicate=이미 사용 중인 프로파일 ID입니다.
revoke.confirmMismatch=시리얼 끝 6자리가 일치하지 않습니다.
kms.aliasExists=이미 사용 중인 별칭입니다.
typeMismatch=형식이 올바르지 않습니다.
